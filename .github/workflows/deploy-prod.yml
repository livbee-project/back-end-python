name: Deploy to Prod Environment

on:
  push:
    branches:
      - prod
  workflow_dispatch:  # 수동 실행 가능

jobs:
  deploy:
    name: Deploy to Prod Server
    runs-on: ubuntu-latest
    environment: production  # GitHub에서 수동 승인 설정 가능
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure image metadata
        id: meta
        run: |
          OWNER=$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')
          echo "owner=$OWNER" >> $GITHUB_OUTPUT
          echo "base_image=ghcr.io/$OWNER/livbee-backend-base:latest" >> $GITHUB_OUTPUT
          echo "app_image=ghcr.io/$OWNER/livbee-backend-prod" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ secrets.GHCR_USERNAME }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Build & push base image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.base
          push: true
          tags: ${{ steps.meta.outputs.base_image }}
          cache-from: type=gha,scope=base
          cache-to: type=gha,scope=base,mode=max

      - name: Build & push app image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ steps.meta.outputs.app_image }}:${{ github.sha }}
            ${{ steps.meta.outputs.app_image }}:latest
          cache-from: type=gha,scope=prod
          cache-to: type=gha,scope=prod,mode=max
          build-args: |
            GHCR_BASE_IMAGE=${{ steps.meta.outputs.base_image }}

      - name: Deploy to server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.PROD_SERVER_HOST }}
          username: ${{ secrets.PROD_SERVER_USER }}
          key: ${{ secrets.PROD_SSH_PRIVATE_KEY }}
          port: 22
          script: |
            IMAGE="${{ steps.meta.outputs.app_image }}:${{ github.sha }}"
            cd /home/${{ secrets.PROD_SERVER_USER }}/livbee-backend

            echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u "${{ secrets.GHCR_USERNAME }}" --password-stdin
            docker pull "$IMAGE"

            cat > .env <<EOF
            DB_HOST=${{ secrets.PROD_DB_HOST }}
            DB_PORT=${{ secrets.PROD_DB_PORT }}
            DB_NAME=${{ secrets.PROD_DB_NAME }}
            DB_USER=${{ secrets.PROD_DB_USER }}
            DB_PASSWORD=${{ secrets.PROD_DB_PASSWORD }}
            JWT_SECRET=${{ secrets.PROD_JWT_SECRET }}
            NODE_ENV=production
            EOF

            docker stop livbee-backend-prod 2>/dev/null || true
            docker rm livbee-backend-prod 2>/dev/null || true

            docker run -d \
              --name livbee-backend-prod \
              --restart always \
              -p 8000:8000 \
              --env-file .env \
              "$IMAGE"

            docker logout ghcr.io
            echo "✅ 배포 완료!"

      - name: Health check
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.PROD_SERVER_HOST }}
          username: ${{ secrets.PROD_SERVER_USER }}
          key: ${{ secrets.PROD_SSH_PRIVATE_KEY }}
          port: 22
          script: |
            sleep 15
            for i in {1..5}; do
              if curl -f http://localhost:8000/healthz 2>/dev/null; then
                echo "✅ 헬스체크 성공!"
                exit 0
              fi
              echo "헬스체크 재시도 $i/5..."
              sleep 3
            done
            echo "❌ 헬스체크 실패"
            docker logs livbee-backend-prod --tail 50
            exit 1

