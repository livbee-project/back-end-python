name: Deploy to Dev Environment

on:
  push:
    branches:
      - dev
  workflow_dispatch:  # 수동 실행 가능

jobs:
  deploy:
    name: Deploy to Dev Server
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure image metadata
        id: meta
        run: |
          OWNER=$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')
          echo "owner=$OWNER" >> $GITHUB_OUTPUT
          echo "base_image=ghcr.io/$OWNER/livbee-backend-base:latest" >> $GITHUB_OUTPUT
          echo "app_image=ghcr.io/$OWNER/livbee-backend-dev" >> $GITHUB_OUTPUT

      - name: Prepare GHCR credentials
        id: ghcr-creds
        env:
          SECRET_USER: ${{ secrets.GHCR_USERNAME }}
          SECRET_TOKEN: ${{ secrets.GHCR_TOKEN }}
        run: |
          echo "🔍 디버깅: SECRET_USER=${SECRET_USER:+'(설정됨)'}${SECRET_USER:-'(비어있음)'}"
          echo "🔍 디버깅: SECRET_TOKEN=${SECRET_TOKEN:+'(설정됨)'}${SECRET_TOKEN:-'(비어있음)'}"
          if [ -z "$SECRET_USER" ] || [ -z "$SECRET_TOKEN" ]; then
            echo "❌ GHCR_USERNAME 또는 GHCR_TOKEN이 설정되지 않았습니다."
            echo "GitHub Secrets에 GHCR_USERNAME과 GHCR_TOKEN이 설정되어 있는지 확인해주세요."
            exit 1
          fi
          echo "username=$SECRET_USER" >> $GITHUB_OUTPUT
          echo "password=$SECRET_TOKEN" >> $GITHUB_OUTPUT
          echo "deploy_username=$SECRET_USER" >> $GITHUB_OUTPUT
          echo "deploy_token=$SECRET_TOKEN" >> $GITHUB_OUTPUT
          echo "✅ GHCR 자격증명 준비 완료: $SECRET_USER"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ steps.ghcr-creds.outputs.username }}
          password: ${{ steps.ghcr-creds.outputs.password }}

      - name: Build & push base image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.base
          push: true
          tags: ${{ steps.meta.outputs.base_image }}
          cache-from: type=gha,scope=base
          cache-to: type=gha,scope=base,mode=max

      - name: Build & push app image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ steps.meta.outputs.app_image }}:${{ github.sha }}
            ${{ steps.meta.outputs.app_image }}:latest
          cache-from: type=gha,scope=dev
          cache-to: type=gha,scope=dev,mode=max
          build-args: |
            GHCR_BASE_IMAGE=${{ steps.meta.outputs.base_image }}

      - name: Deploy to server
        uses: appleboy/ssh-action@v1.0.3
        env:
          GHCR_DEPLOY_USERNAME: ${{ secrets.GHCR_USERNAME }}
          GHCR_DEPLOY_TOKEN: ${{ secrets.GHCR_TOKEN }}
        with:
          host: ${{ secrets.DEV_SERVER_HOST }}
          username: ${{ secrets.DEV_SERVER_USER }}
          key: ${{ secrets.DEV_SSH_PRIVATE_KEY }}
          port: 22
          envs: GHCR_DEPLOY_USERNAME,GHCR_DEPLOY_TOKEN
          script: |
            set -eo pipefail
            IMAGE="${{ steps.meta.outputs.app_image }}:${{ github.sha }}"
            cd /home/${{ secrets.DEV_SERVER_USER }}/livbee-backend

            # 디버깅: 환경변수 확인
            echo "🔍 디버깅: 모든 환경변수 목록:"
            env | grep -E "GHCR|GITHUB" || echo "GHCR 관련 환경변수 없음"
            echo ""
            echo "🔍 디버깅: GHCR_DEPLOY_USERNAME=${GHCR_DEPLOY_USERNAME:+'(설정됨)'}${GHCR_DEPLOY_USERNAME:-'(비어있음)'}"
            echo "🔍 디버깅: GHCR_DEPLOY_TOKEN=${GHCR_DEPLOY_TOKEN:+'(설정됨)'}${GHCR_DEPLOY_TOKEN:-'(비어있음)'}"
            echo ""

            # 자격증명 확인
            if [ -z "${GHCR_DEPLOY_USERNAME:-}" ] || [ -z "${GHCR_DEPLOY_TOKEN:-}" ]; then
              echo "❌ GHCR 자격증명이 없습니다."
              echo "GitHub Secrets에 GHCR_USERNAME과 GHCR_TOKEN을 설정해주세요."
              echo ""
              echo "PAT 발급 방법:"
              echo "1. GitHub → Settings → Developer settings → Personal access tokens → Tokens (classic)"
              echo "2. Generate new token (classic)"
              echo "3. Scopes: read:packages, write:packages 선택"
              echo "4. 생성된 토큰을 GitHub Secrets의 GHCR_TOKEN에 추가"
              exit 1
            fi

            # GHCR 로그인
            echo "🔐 GHCR 로그인 중..."
            if echo "${GHCR_DEPLOY_TOKEN}" | docker login ghcr.io -u "${GHCR_DEPLOY_USERNAME}" --password-stdin 2>&1; then
              LOGIN_DONE=1
              echo "✅ GHCR 로그인 성공"
            else
              echo "❌ GHCR 로그인 실패"
              echo "토큰이 유효한지 확인해주세요."
              exit 1
            fi

            echo "📥 이미지 pull 시작: $IMAGE"
            DOCKER_CLI_EXPERIMENTAL=enabled docker pull "$IMAGE" --quiet 2>&1 || {
              echo "❌ 이미지 pull 실패"
              echo "이미지가 존재하지 않거나 인증이 필요합니다."
              exit 1
            }
            echo "✅ 이미지 pull 성공"

            cat > .env <<EOF
            DB_HOST=${{ secrets.DEV_DB_HOST }}
            DB_PORT=${{ secrets.DEV_DB_PORT }}
            DB_NAME=${{ secrets.DEV_DB_NAME }}
            DB_USER=${{ secrets.DEV_DB_USER }}
            DB_PASSWORD=${{ secrets.DEV_DB_PASSWORD }}
            JWT_SECRET=${{ secrets.DEV_JWT_SECRET }}
            NODE_ENV=development
            CLOUDINARY_CLOUD_NAME=${{ secrets.CLOUDINARY_CLOUD_NAME }}
            CLOUDINARY_API_KEY=${{ secrets.CLOUDINARY_API_KEY }}
            CLOUDINARY_API_SECRET=${{ secrets.CLOUDINARY_API_SECRET }}
            EOF

            docker stop livbee-backend-dev 2>/dev/null || true
            docker rm livbee-backend-dev 2>/dev/null || true

            docker run -d \
              --name livbee-backend-dev \
              --restart always \
              -p 8000:8000 \
              --env-file .env \
              "$IMAGE"

            if [ "$LOGIN_DONE" -eq 1 ]; then
              docker logout ghcr.io
            fi
            echo "✅ 배포 완료!"

      - name: Health check
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEV_SERVER_HOST }}
          username: ${{ secrets.DEV_SERVER_USER }}
          key: ${{ secrets.DEV_SSH_PRIVATE_KEY }}
          port: 22
          script: |
            sleep 10
            for i in {1..5}; do
              if curl -f http://localhost:8000/healthz 2>/dev/null; then
                echo "✅ 헬스체크 성공!"
                exit 0
              fi
              echo "헬스체크 재시도 $i/5..."
              sleep 2
            done
            echo "❌ 헬스체크 실패"
            docker logs livbee-backend-dev --tail 50
            exit 1

