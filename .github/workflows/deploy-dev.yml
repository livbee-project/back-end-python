name: Deploy to Dev Environment

on:
  push:
    branches:
      - dev
  workflow_dispatch:  # 수동 실행 가능

jobs:
  deploy:
    name: Deploy to Dev Server
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: livbee-backend-dev:${{ github.sha }},livbee-backend-dev:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          load: true

      - name: Save Docker image
        run: |
          docker save livbee-backend-dev | gzip -1 > livbee-backend-dev.tar.gz

      - name: Copy Docker image to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEV_SERVER_HOST }}
          username: ${{ secrets.DEV_SERVER_USER }}
          key: ${{ secrets.DEV_SSH_PRIVATE_KEY }}
          port: 22
          source: "livbee-backend-dev.tar.gz"
          target: "/home/${{ secrets.DEV_SERVER_USER }}/livbee-backend"
          strip_components: 0
          rm: false

      - name: Deploy to server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEV_SERVER_HOST }}
          username: ${{ secrets.DEV_SERVER_USER }}
          key: ${{ secrets.DEV_SSH_PRIVATE_KEY }}
          port: 22
          script: |
            cd /home/${{ secrets.DEV_SERVER_USER }}/livbee-backend
            
            # Docker 이미지 로드
            if [ -f livbee-backend-dev.tar.gz ]; then
              docker load < livbee-backend-dev.tar.gz
              rm -f livbee-backend-dev.tar.gz
            fi
            
            # .env 파일 동적 생성
            cat > .env <<EOF
            DB_HOST=${{ secrets.DEV_DB_HOST }}
            DB_PORT=${{ secrets.DEV_DB_PORT }}
            DB_NAME=${{ secrets.DEV_DB_NAME }}
            DB_USER=${{ secrets.DEV_DB_USER }}
            DB_PASSWORD=${{ secrets.DEV_DB_PASSWORD }}
            JWT_SECRET=${{ secrets.DEV_JWT_SECRET }}
            NODE_ENV=production
            EOF
            
            # 기존 컨테이너 중지 및 제거
            docker stop livbee-backend-dev 2>/dev/null || true
            docker rm livbee-backend-dev 2>/dev/null || true
            
            # 새 컨테이너 실행
            docker run -d \
              --name livbee-backend-dev \
              --restart always \
              -p 8000:8000 \
              --env-file .env \
              livbee-backend-dev
            
            echo "✅ 배포 완료!"

      - name: Health check
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEV_SERVER_HOST }}
          username: ${{ secrets.DEV_SERVER_USER }}
          key: ${{ secrets.DEV_SSH_PRIVATE_KEY }}
          port: 22
          script: |
            sleep 15
            for i in {1..5}; do
              if curl -f http://localhost:8000/healthz 2>/dev/null; then
                echo "✅ 헬스체크 성공!"
                exit 0
              fi
              echo "헬스체크 재시도 $i/5..."
              sleep 3
            done
            echo "❌ 헬스체크 실패"
            docker logs livbee-backend-dev --tail 50
            exit 1

