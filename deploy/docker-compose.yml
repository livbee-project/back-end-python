version: '3.8'

services:
  fastapi:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: livbee-backend-${ENV:-dev}
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT:-5432}
      - DB_NAME=${DB_NAME}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
    networks:
      - livbee-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/"] || exit 1
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  livbee-network:
    driver: bridge

