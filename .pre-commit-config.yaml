# pre-commit 설정
# 설치: pre-commit install
# 수동 실행: pre-commit run --all-files
# pyproject.toml의 [tool.black], [tool.ruff], [tool.mypy] 설정과 연동됨

repos:
  # 기본 훅: trailing whitespace, end of file 등
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
      - id: check-json
      - id: check-toml

  # Black: app, tests 포맷팅
  - repo: https://github.com/psf/black
    rev: 26.1.0
    hooks:
      - id: black
        args: [--config=pyproject.toml]
        files: ^(app|tests)/

  # Ruff: app, tests 린팅 (ruff-check = linter, 포맷팅은 black 사용)
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.4
    hooks:
      - id: ruff-check
        args: [--fix, --exit-non-zero-on-fix]
        files: ^(app|tests)/

  # Mypy: app만 (tests/alembic 제외, pyproject.toml exclude와 일치)
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.19.1
    hooks:
      - id: mypy
        args: [--config-file=pyproject.toml]
        files: ^app/
        additional_dependencies:
          - types-PyYAML
          - sqlalchemy[mypy]
          - pydantic
