# Dev 환경 Nginx 설정
# /etc/nginx/sites-available/dev-api.livbee.co.kr
# 심볼릭 링크: sudo ln -s /etc/nginx/sites-available/dev-api.livbee.co.kr /etc/nginx/sites-enabled/

# HTTP to HTTPS 리다이렉트
server {
    listen 80;
    server_name dev-api.livbee.co.kr;
    
    # Let's Encrypt 인증서 발급을 위한 경로
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    
    # HTTPS로 리다이렉트
    location / {
        return 301 https://$server_name$request_uri;
    }
}

# HTTPS 서버 설정
server {
    listen 443 ssl http2;
    server_name dev-api.livbee.co.kr;

    # SSL 인증서 설정 (Let's Encrypt)
    ssl_certificate /etc/letsencrypt/live/dev-api.livbee.co.kr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dev-api.livbee.co.kr/privkey.pem;
    
    # SSL 보안 설정
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # 로그 설정
    access_log /var/log/nginx/dev-api-access.log;
    error_log /var/log/nginx/dev-api-error.log;

    # 클라이언트 최대 요청 크기
    client_max_body_size 10M;

    # FastAPI 백엔드로 프록시
    location / {
        proxy_pass http://localhost:8000;
        proxy_http_version 1.1;
        
        # 헤더 설정
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $server_name;
        
        # 타임아웃 설정
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        
        # WebSocket 지원 (필요한 경우)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # 헬스체크 엔드포인트
    location /health {
        proxy_pass http://localhost:8000/db-test;
        access_log off;
    }
}

